# pnpm v10 起，overrides 与 peerDependencyRules 从 package.json 的 "pnpm" 字段
# 迁移到本文件（https://pnpm.io/settings）。overrides 均为传递依赖的 CVE 修复锁定。
peerDependencyRules:
  ignoreMissing:
    - '@nestjs/websockets'
    - '@nestjs/common'
    - '@nestjs/core'
overrides:
  punycode: 'npm:punycode.js@2.3.1'
  '@nestjs/serve-static>path-to-regexp': '^1.9.0'
  tough-cookie: '^4.1.4'
  'lodash@<=4.17.23': 4.18.1
  'multer@<2.2.0': 2.2.0
  'tmp@<0.2.6': 0.2.7
  'brace-expansion@<1.1.18': 1.1.18
  'brace-expansion@>=2.0.0 <2.1.4': 2.1.4
  'glob@>=10.2.0 <10.5.0': 10.5.0
  'js-yaml@>=3.0.0 <3.15.1': 3.15.1
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  'picomatch@>=4.0.0 <4.0.4': 4.0.4
  'undici@>=7.0.0 <7.29.0': 7.29.0
  'hono@<4.12.25': 4.13.1
  'fast-uri@>=3.0.0 <3.1.5': 3.1.5
  'ip-address@<=10.3.0': 10.5.0
